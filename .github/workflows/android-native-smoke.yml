name: Android Native Anonymous Smoke

on:
  push:
    branches: [feature/native-team-first-flow-v1]
    paths:
      - "app/**"
      - "assets/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "app.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/android-native-smoke.py"
      - ".github/workflows/android-native-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-release-smoke:
    # Standard public-repository runner only. A visibility or branch change
    # skips this job; it never falls back to a paid/private/larger runner.
    if: >-
      github.repository == 'libing-hong/Atlas-Mobile' &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/feature/native-team-first-flow-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_SUPABASE_URL: https://efvpndayardwjqtwtdmx.supabase.co
      # Existing public project key from android-preview-apk.yml; not a secret.
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_P0c1JB0dFOICwntFalOxOw_wetxrArJ
      EXPO_PUBLIC_ATLAS_API_URL: https://atlas-os-preview-git-feature-nativ-e1665d-libing-hongs-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Check before the expensive build. udev trigger is asynchronous, so wait
      # for its rule application before testing access to the KVM device.
      - name: Verify emulator hardware acceleration before building
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          if ! test -c /dev/kvm; then
            echo '::error::The standard runner has no KVM character device; native smoke cannot run.'
            exit 1
          fi
          ls -l /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo '::error::KVM remained inaccessible after udev settled; native smoke cannot run.'
            exit 1
          fi
          python3 -c 'import os,fcntl; fd=os.open("/dev/kvm",os.O_RDWR); assert fcntl.ioctl(fd,0xAE00,0)==12, "Unsupported KVM API"; os.close(fd); print("KVM API 12 accessible")'
      - name: Record KVM diagnostics even when preflight fails
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          device = Path('/dev/kvm')
          info = {'sourceSha': os.environ['GITHUB_SHA'], 'deviceExists': device.exists(),
                  'readable': os.access(device, os.R_OK), 'writable': os.access(device, os.W_OK),
                  'runnerUid': os.getuid(), 'runnerGroups': os.getgroups()}
          if device.exists():
              mode = device.stat()
              info.update(characterDevice=stat.S_ISCHR(mode.st_mode), mode=oct(stat.S_IMODE(mode.st_mode)),
                          ownerUid=mode.st_uid, ownerGid=mode.st_gid)
          output = Path('artifacts/android-smoke')
          output.mkdir(parents=True, exist_ok=True)
          output.joinpath('kvm-preflight.json').write_text(json.dumps(info, indent=2), encoding='utf-8')
          print(json.dumps(info))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --import tsx --test tests/*.test.ts
      - run: npx expo prebuild --no-install --platform android
      - name: Build bundled release for the x86_64 emulator
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
      - name: Install and test anonymous Chinese screens without Metro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-native-smoke.py --apk android/app/build/outputs/apk/release/app-release.apk --output artifacts/android-smoke
      - name: Retain smoke evidence briefly, without distributing an APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-smoke-${{ github.sha }}
          path: artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 1
