name: Android Native Profile Acceptance

on:
  push:
    branches: [feature/native-team-first-flow-v1]
    paths:
      - scripts/android-profile-e2e.py
      - .github/workflows/android-profile-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

# One designated account; do not cancel a run while its reversible write needs
# cleanup. Runner loss can still interrupt cleanup and must never imply PASS.
concurrency:
  group: atlas-preview-designated-profile-account
  cancel-in-progress: false

jobs:
  authenticated-profile:
    if: >-
      github.repository == 'libing-hong/Atlas-Mobile' &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/feature/native-team-first-flow-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_SUPABASE_URL: https://efvpndayardwjqtwtdmx.supabase.co
      # Existing public project key, never a service-role credential.
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_P0c1JB0dFOICwntFalOxOw_wetxrArJ
      EXPO_PUBLIC_ATLAS_API_URL: https://atlas-os-preview-git-feature-nativ-e1665d-libing-hongs-projects.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified commit
        with:
          persist-credentials: false
      - name: Require safely configured test credentials before any build
        id: credentials
        env:
          ATLAS_PREVIEW_TEST_EMAIL: ${{ secrets.ATLAS_PREVIEW_TEST_EMAIL }}
          ATLAS_PREVIEW_TEST_PASSWORD: ${{ secrets.ATLAS_PREVIEW_TEST_PASSWORD }}
        run: python3 scripts/android-profile-e2e.py --preflight
      - name: Verify standard runner KVM before building
        if: steps.credentials.outputs.ready == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          python3 - <<'PY'
          import fcntl, os, stat, sys
          try:
              mode = os.stat('/dev/kvm').st_mode
              assert stat.S_ISCHR(mode) and os.access('/dev/kvm', os.R_OK | os.W_OK)
              descriptor = os.open('/dev/kvm', os.O_RDWR)
              try:
                  assert fcntl.ioctl(descriptor, 0xAE00, 0) == 12
              finally:
                  os.close(descriptor)
          except Exception:
              print('BLOCKED KVM_UNAVAILABLE')
              sys.exit(2)
          print('PASS KVM_API_12')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified commit
        with:
          node-version: 22.13.1
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified commit
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --import tsx --test tests/*.test.ts
      - run: npx expo prebuild --no-install --platform android
      - name: Build bundled release for the x86_64 emulator
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
      - name: Prepare official Android SDK and fixed AVD without credentials
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name atlas_profile_acceptance --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$RUNNER_TEMP/atlas-profile-avd" >/dev/null
      - name: Start official emulator without credentials or persisted logs
        id: emulator-start
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, time
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          config = Path(os.environ['RUNNER_TEMP']) / 'atlas-profile-avd' / 'config.ini'
          try:
              with config.open('a') as handle:
                  handle.write('\nhw.keyboard=yes\nhw.ramSize=3072\nhw.cpu.ncore=2\n')
              process = subprocess.Popen([
                  str(sdk / 'emulator' / 'emulator'), '-avd', 'atlas_profile_acceptance',
                  '-port', '5554', '-no-window', '-gpu', 'swiftshader_indirect',
                  '-accel', 'on', '-no-snapshot', '-noaudio', '-no-boot-anim', '-camera-back', 'none',
              ], stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  start_new_session=True)
              adb = [str(sdk / 'platform-tools' / 'adb'), '-s', 'emulator-5554']
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      raise RuntimeError()
                  boot = subprocess.run(adb + ['shell', 'getprop', 'sys.boot_completed'],
                                        capture_output=True, timeout=15, check=False)
                  if boot.returncode == 0 and boot.stdout.strip() == b'1':
                      break
                  time.sleep(2)
              else:
                  raise RuntimeError()
              for setting in ('window_animation_scale', 'transition_animation_scale', 'animator_duration_scale'):
                  subprocess.run(adb + ['shell', 'settings', 'put', 'global', setting, '0'],
                                 capture_output=True, timeout=15, check=True)
              subprocess.run(adb + ['shell', 'wm', 'dismiss-keyguard'],
                             capture_output=True, timeout=15, check=True)
          except Exception:
              print('BLOCKED EMULATOR_START_FAILED')
              sys.exit(2)
          print('PASS EMULATOR_BOOT_COMPLETED')
          PY
      - name: Exercise designated synthetic profile through normal Android login
        # These credentials are absent from SDK setup and the emulator process.
        env:
          ATLAS_PREVIEW_TEST_EMAIL: ${{ secrets.ATLAS_PREVIEW_TEST_EMAIL }}
          ATLAS_PREVIEW_TEST_PASSWORD: ${{ secrets.ATLAS_PREVIEW_TEST_PASSWORD }}
        run: python3 scripts/android-profile-e2e.py --apk android/app/build/outputs/apk/release/app-release.apk
      - name: Stop ephemeral emulator
        if: always() && steps.emulator-start.outcome != 'skipped' && steps.emulator-start.outcome != ''
        run: adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
      # No upload-artifact, screenshot, UI XML, credential file, raw logcat or
      # post-login recording. Only allowlisted check results enter the summary.
