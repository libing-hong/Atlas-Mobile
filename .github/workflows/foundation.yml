name: Mobile foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile for review
        run: |
          npm install --package-lock-only --ignore-scripts
          node -e "const s=require('fs').readFileSync('package-lock.json').toString('base64'); for(let i=0;i<s.length;i+=12000) console.log('LOCK_PART='+s.slice(i,i+12000));"
      - run: npm ci
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Foundation safety tests
        run: npm test
      - name: Expo configuration and dependency validation
        run: npm run config:check
      - name: Android bundle compatibility
        run: npm run check:android
      - name: iOS bundle compatibility
        run: npm run check:ios
      - name: Native configuration compatibility
        run: npx expo prebuild --no-install --platform all
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-foundation-bundles
          path: dist
